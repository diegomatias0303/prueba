?<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Jugador - Lotería Mexicana</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Montserrat:wght@400;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mexPink: '#e11d48', mexYellow: '#facc15', mexGreen: '#15803d',
                        mexGreenDark: '#166534', mexOrange: '#ea580c', mexBlue: '#0284c7',
                        mexPurple: '#9333ea', mexPaper: '#fefce8', mexDark: '#1c1917',
                        mexVintage: '#fff8e7'
                    },
                    fontFamily: {
                        marker: ['"Permanent Marker"', 'cursive'],
                        fredoka: ['Fredoka', 'sans-serif'],
                        sans: ['Montserrat', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #fef08a;
            color: #1c1917;
            background-image: radial-gradient(#ca8a04 1.5px, transparent 1.5px);
            background-size: 28px 28px;
        }
        .mexican-border { border: 4px solid #1c1917; box-shadow: 6px 6px 0px #1c1917; }
        .mexican-card-shadow { box-shadow: 4px 4px 0px #1c1917; }
        .bandera { clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 85% 90%, 70% 100%, 50% 90%, 30% 100%, 15% 90%, 0% 100%); }
        @keyframes wave {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }
        .animate-wave { animation: wave 2.5s infinite ease-in-out; transform-origin: top center; }
    </style>
</head>
<body class="min-h-full flex flex-col font-sans selection:bg-mexPink selection:text-white relative justify-center items-center p-4 py-12">

    <!-- Papel Picado Decorativo -->
    <div class="fixed top-0 left-0 w-full flex justify-around pointer-events-none z-[60] overflow-visible h-12">
        <div class="w-12 h-14 bg-[#15803d] bandera animate-wave shadow-lg" style="animation-delay: 0.1s;"></div>
        <div class="w-12 h-14 bg-[#ffffff] bandera animate-wave shadow-lg" style="animation-delay: 0.3s;"></div>
        <div class="w-12 h-14 bg-[#e11d48] bandera animate-wave shadow-lg" style="animation-delay: 0.5s;"></div>
        <div class="w-12 h-14 bg-[#facc15] bandera animate-wave shadow-lg hidden sm:block" style="animation-delay: 0.2s;"></div>
        <div class="w-12 h-14 bg-[#15803d] bandera animate-wave shadow-lg hidden sm:block" style="animation-delay: 0.4s;"></div>
        <div class="w-12 h-14 bg-[#e11d48] bandera animate-wave shadow-lg" style="animation-delay: 0.6s;"></div>
    </div>

    <div class="w-full max-w-md bg-mexPaper mexican-border p-6 sm:p-8 rounded-2xl z-10 relative">
        <!-- Encabezado -->
        <div class="text-center mb-6">
            <div class="w-16 h-16 rounded-2xl bg-mexPink border-3 border-mexDark flex items-center justify-center text-3xl shadow-md mx-auto mb-3 transform -rotate-3">
                🪅
            </div>
            <h1 class="font-marker text-3xl text-mexGreenDark tracking-wide drop-shadow-[1px_1px_0px_#000]">
                ¡Únete a la Jugada!
            </h1>
            <p class="font-fredoka text-mexDark/80 text-sm mt-1">Crea tu cuenta para jugar a la Lotería</p>
        </div>

        {% if error %}
            <div class="mb-5 p-3.5 rounded-xl bg-red-100 border-2 border-red-600 text-red-800 text-xs font-fredoka font-bold flex items-center gap-2 shadow-sm">
                <span class="text-lg">⚠️</span>
                <span>{{ error }}</span>
            </div>
        {% endif %}

        <!-- Formulario de Registro -->
        <form method="POST" action="/register" class="space-y-4">
            <div>
                <label class="block text-xs font-fredoka font-bold text-mexGreenDark uppercase tracking-wider mb-1">Nombre Completo o Apodo</label>
                <input type="text" name="nombre" value="{{ nombre }}" required placeholder="Ej: Doña Martha" maxlength="100" class="w-full px-4 py-2.5 rounded-xl bg-white border-2 border-mexDark text-mexDark font-fredoka text-sm focus:outline-none focus:ring-4 focus:ring-mexYellow shadow-inner">
            </div>

            <div>
                <label class="block text-xs font-fredoka font-bold text-mexGreenDark uppercase tracking-wider mb-1">Nombre de Usuario</label>
                <input type="text" name="usuario" value="{{ usuario }}" required placeholder="Ej: martha_cantora" maxlength="20" class="w-full px-4 py-2.5 rounded-xl bg-white border-2 border-mexDark text-mexDark font-fredoka text-sm focus:outline-none focus:ring-4 focus:ring-mexYellow shadow-inner">
                <span class="text-[10px] text-mexDark/60 font-fredoka">Sin espacios, de 3 a 20 caracteres</span>
            </div>

            <div>
                <label class="block text-xs font-fredoka font-bold text-mexGreenDark uppercase tracking-wider mb-1">Correo Electrónico</label>
                <input type="email" name="email" value="{{ email }}" required placeholder="correo@ejemplo.com" maxlength="120" class="w-full px-4 py-2.5 rounded-xl bg-white border-2 border-mexDark text-mexDark font-fredoka text-sm focus:outline-none focus:ring-4 focus:ring-mexYellow shadow-inner">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-fredoka font-bold text-mexGreenDark uppercase tracking-wider mb-1">Contraseña</label>
                    <input type="password" name="password" required placeholder="Mínimo 6 caracteres" minlength="6" class="w-full px-4 py-2.5 rounded-xl bg-white border-2 border-mexDark text-mexDark font-fredoka text-sm focus:outline-none focus:ring-4 focus:ring-mexYellow shadow-inner">
                </div>
                <div>
                    <label class="block text-xs font-fredoka font-bold text-mexGreenDark uppercase tracking-wider mb-1">Confirmar</label>
                    <input type="password" name="confirm_password" required placeholder="Repite contraseña" minlength="6" class="w-full px-4 py-2.5 rounded-xl bg-white border-2 border-mexDark text-mexDark font-fredoka text-sm focus:outline-none focus:ring-4 focus:ring-mexYellow shadow-inner">
                </div>
            </div>

            <button type="submit" class="w-full mt-4 py-3.5 px-4 rounded-xl bg-mexGreen hover:bg-mexGreenDark text-white font-fredoka font-bold text-base mexican-card-shadow transition-transform hover:-translate-y-0.5 active:translate-y-0">
                🎉 Crear Cuenta y Jugar
            </button>
        </form>

        <div class="mt-6 pt-4 border-t-2 border-mexDark/15 text-center font-fredoka text-sm">
            <span class="text-mexDark/70">¿Ya tienes una cuenta registrada?</span>
            <a href="/login" class="block mt-1 font-bold text-mexPink hover:text-mexPink/80 underline decoration-2">
                Iniciar Sesión Aquí 🚪
            </a>
        </div>
    </div>

    <!-- Pie de página informativo -->
    <div class="mt-6 text-center text-xs font-mono text-mexDark/60 z-10">
        BD SQL: <strong>loteria_mexicana</strong> (XAMPP / MySQL)
    </div>
</body>
</html>
